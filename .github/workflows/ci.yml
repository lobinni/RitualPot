name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax
        run: python3 -m py_compile contracts/RitualPot.py
      - name: Contract suite (architecture, refusals, money, timings)
        run: python3 tests/test_contract.py
      - name: Deployed code equals this source
        run: python3 scripts/verify_deployment.py

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm exec tsc -- --noEmit
      - name: Build
        run: npm run build
